name: Rasterize Minimal Peak app icons (v99.7.12)
on:
  push:
    branches: [v99-7-12-visual-asset-fixes]
    paths:
      - .github/workflows/rasterize-peak-v99.yml
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v99-7-12-visual-asset-fixes
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize supplied dark SVG for PWA and Apple touch
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.8.2
          python - <<'PY'
          import cairosvg
          for name,size in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              cairosvg.svg2png(url='icons/icon.svg',write_to='icons/'+name,output_width=size,output_height=size)
          PY
      - name: Commit generated PNGs to this feature branch
        run: |
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'v99.7.12: render matching Apple touch and PWA PNGs'
            git push origin HEAD:v99-7-12-visual-asset-fixes
          fi
