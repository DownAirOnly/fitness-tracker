<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11251d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A simple private home for food, lifting and weight logs.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=9">
  <title>Everyday · Fitness tracker</title>
</head>
<body>
  <div id="app"><div class="shell"><header class="top"><button class="brand" data-action="home" disabled=""><span class="mark">✳</span> everyday<span class="brand-dot">.</span></button><button class="top-date" data-action="history" disabled="">—</button></header><main aria-busy="true"><section class="home-actions" aria-label="What do you want to log?"><button class="big-action food-action" data-action="food" disabled=""><span class="action-icon">◒</span><span><strong>Food</strong><small>Calories, protein &amp; saved foods</small></span><b>↗</b></button><button class="big-action lift-action" data-action="gym" disabled=""><span class="action-icon">▣</span><span><strong>Lifting</strong><small>Sets, reps &amp; previous workouts</small></span><b>↗</b></button></section><section class="today-card"><div class="section-head"><div><p class="eyebrow">AT A GLANCE</p><h2>Today so far</h2></div><button type="button" class="text-btn" data-action="history" disabled="">View day ↗</button></div><div class="metric-row"><div><b>—</b><small>of — cal</small><div class="bar"><span style="width:0%;background:#d8eb86"></span></div></div><div><b>—<em>g</em></b><small>of —g protein</small><div class="bar"><span style="width:0%;background:#9fd9bf"></span></div></div></div><p class="hint">—</p></section><section class="weight-strip"><div><span class="small-icon">⚖</span><span><strong>—</strong><small>—</small></span></div><button type="button" class="outline small" data-action="weight" disabled="">Log weight</button></section></main><div class="account-banner" role="status"><span>—<small>—</small></span><button type="button" class="text-btn" data-action="account" disabled="">Account</button></div><nav class="nav" aria-label="Main navigation"><button class="active" data-action="home" disabled="" aria-label="Home" aria-current="page"><span>⌂</span><small>Home</small></button><button class="" data-action="food" disabled="" aria-label="Food"><span>◒</span><small>Food</small></button><button class="" data-action="gym" disabled="" aria-label="Lifting"><span>▣</span><small>Lifting</small></button><button class="" data-action="progress" disabled="" aria-label="Progress"><span>↗</span><small>Progress</small></button><button class="" data-action="settings" disabled="" aria-label="More"><span>⚙</span><small>More</small></button></nav></div><div id="overlay"></div></div>
  <script type="module" src="app.js?v=9"></script>
</body>
</html>
